services:

  postgres:
    image: 'postgres:14.1-alpine'
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=llumiss
      - POSTGRES_PASSWORD=kpi-diploma
      - POSTGRES_DB=notes_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: